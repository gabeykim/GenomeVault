<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GenomeVault · Sample labels</title>
  <style>
    /* Printable sheet of the synthetic labels (I1) for photographing in the S2 beat. No external assets (I8). */
    body { margin: 0; padding: 24px; background: #02070A; color: #f2ede4; font: 14px/1.45 "Helvetica Neue", Helvetica, Arial, sans-serif; }
    h1 { font-size: 22px; font-weight: 500; margin: 0 0 4px; }
    p { margin: 0 0 20px; color: #8d9ca6; }
    .grid { display: grid; gap: 18px; grid-template-columns: repeat(auto-fill, minmax(420px, 1fr)); }
    figure { margin: 0; }
    img { width: 100%; height: auto; display: block; background: #fff; }
    figcaption { margin-top: 6px; font-size: 12px; color: #8d9ca6; }
    @media print { body { background: #fff; color: #000; padding: 0; } p, h1 { display: none; } .grid { gap: 10mm; }
      figure { break-inside: avoid; } figcaption { color: #444; } }
  </style>
</head>
<body>
  <h1>Sample labels (synthetic)</h1>
  <p>Print this page or show it on another screen, then use "Take a photo of a label" on the phone. Not real prescriptions.</p>
  <div class="grid">
    <figure><img src="/phone-assets/samples/clopidogrel.png" alt="Clopidogrel 75 mg label"><figcaption>Clopidogrel 75 mg · X1, X2</figcaption></figure>
    <figure><img src="/phone-assets/samples/omeprazole.png" alt="Omeprazole 20 mg label"><figcaption>Omeprazole 20 mg · X2</figcaption></figure>
    <figure><img src="/phone-assets/samples/simvastatin.png" alt="Simvastatin 40 mg label"><figcaption>Simvastatin 40 mg · X3</figcaption></figure>
    <figure><img src="/phone-assets/samples/lisinopril.png" alt="Lisinopril 10 mg label"><figcaption>Lisinopril 10 mg · X4</figcaption></figure>
    <figure><img src="/phone-assets/samples/aspirin.png" alt="Aspirin 81 mg label"><figcaption>Aspirin 81 mg · no flag on its own</figcaption></figure>
    <figure><img src="/phone-assets/samples/ibuprofen.png" alt="Ibuprofen 200 mg label"><figcaption>Ibuprofen 200 mg · X5</figcaption></figure>
    <figure><img src="/phone-assets/samples/amoxicillin.png" alt="Amoxicillin 500 mg label"><figcaption>Amoxicillin 500 mg · penicillin allergy (AL-001)</figcaption></figure>
  </div>
</body>
</html>
