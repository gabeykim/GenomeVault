<text x="624.0" y="368" text-anchor="middle">(GenomeVault)</text>
<line x1="64" x2="736" y1="305.0" y2="305.0" stroke="var(--ref)" stroke-width="1.5" stroke-dasharray="6 4"><title>1 in 8 (best possible with k = 8): 12%</title></line>
<rect x="64" y="61" width="10" height="10" rx="2" fill="var(--s1)"/>
<text x="80" y="70">Repeat-ask attacker</text>
<rect x="224.8" y="61" width="10" height="10" rx="2" fill="var(--s2)"/>
<text x="240.8" y="70">Statistical attacker</text>
<line x1="392.8" x2="410.8" y1="66" y2="66" stroke="var(--ref)" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="416.8" y="70">1 in 8 (best possible with k = 8)</text>
</svg>