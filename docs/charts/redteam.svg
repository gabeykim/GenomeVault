<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400" role="img" aria-label="Can an attacker find the real question?">
<title>Can an attacker find the real question?</title>
<style>
svg{--surface:#fcfcfb;--grid:#e6e5e1;--axis:#c3c2b7;--t1:#0b0b0b;--t2:#52514e;--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ref:#52514e}
@media (prefers-color-scheme: dark){svg{--surface:#1a1a19;--grid:#2e2e2c;--axis:#52514e;--t1:#f0efec;--t2:#c3c2b7;--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ref:#c3c2b7}}
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;fill:var(--t2);font-size:12px}
.title{fill:var(--t1);font-size:16px;font-weight:600}.sub{font-size:12px}.val{fill:var(--t1);font-size:10px;letter-spacing:-0.3px}
</style>
<rect width="760" height="400" fill="var(--surface)"/>
<text class="title" x="64" y="28">Can an attacker find the real question?</text>
<text class="sub" x="64" y="48">Share of 500 synthetic patients whose real topic was guessed from outbound traffic (3 asks each)</text>
<line x1="64" x2="736" y1="336.0" y2="336.0" stroke="var(--axis)" stroke-width="1"/>
<text x="56" y="340.0" text-anchor="end">0%</text>
<line x1="64" x2="736" y1="274.0" y2="274.0" stroke="var(--grid)" stroke-width="1"/>
<text x="56" y="278.0" text-anchor="end">25%</text>
<line x1="64" x2="736" y1="212.0" y2="212.0" stroke="var(--grid)" stroke-width="1"/>
<text x="56" y="216.0" text-anchor="end">50%</text>
<line x1="64" x2="736" y1="150.0" y2="150.0" stroke="var(--grid)" stroke-width="1"/>
<text x="56" y="154.0" text-anchor="end">75%</text>
<line x1="64" x2="736" y1="88.0" y2="88.0" stroke="var(--grid)" stroke-width="1"/>
<text x="56" y="92.0" text-anchor="end">100%</text>
<path d="M151.0,336.0V92.0Q151.0,88.0 155.0,88.0H171.0Q175.0,88.0 175.0,92.0V336.0Z" fill="var(--s1)"><title>Naive
(full question) · Repeat-ask attacker: 100%</title></path>
<text class="val" x="163.0" y="82.0" text-anchor="middle">100%</text>
<path d="M177.0,336.0V92.0Q177.0,88.0 181.0,88.0H197.0Q201.0,88.0 201.0,92.0V336.0Z" fill="var(--s2)"><title>Naive
