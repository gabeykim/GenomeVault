<text class="val" x="611.0" y="303.2" text-anchor="middle">11%</text>
<path d="M625.0,336.0V285.9Q625.0,281.9 629.0,281.9H645.0Q649.0,281.9 649.0,285.9V336.0Z" fill="var(--s2)"><title>Fixed buckets
