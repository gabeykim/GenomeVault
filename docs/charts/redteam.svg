<text class="val" x="189.0" y="82.0" text-anchor="middle">100%</text>
<text x="176.0" y="354" text-anchor="middle">Naive</text>
<text x="176.0" y="368" text-anchor="middle">(full question)</text>
<path d="M375.0,336.0V95.5Q375.0,91.5 379.0,91.5H395.0Q399.0,91.5 399.0,95.5V336.0Z" fill="var(--s1)"><title>Random decoys
