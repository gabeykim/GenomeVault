<text class="val" x="413.0" y="88.4" text-anchor="middle">97%</text>
<text x="400.0" y="354" text-anchor="middle">Random decoys</text>
<text x="400.0" y="368" text-anchor="middle">(fresh each ask)</text>
<path d="M599.0,336.0V304.3Q599.0,300.3 603.0,300.3H619.0Q623.0,300.3 623.0,304.3V336.0Z" fill="var(--s1)"><title>Fixed buckets
