<text class="val" x="611.0" y="294.3" text-anchor="middle">14%</text>
<path d="M625.0,336.0V298.8Q625.0,294.8 629.0,294.8H645.0Q649.0,294.8 649.0,298.8V336.0Z" fill="var(--s2)"><title>Fixed buckets
