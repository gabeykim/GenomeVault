<text class="val" x="387.0" y="85.5" text-anchor="middle">99%</text>
<path d="M401.0,336.0V94.5Q401.0,90.5 405.0,90.5H421.0Q425.0,90.5 425.0,94.5V336.0Z" fill="var(--s2)"><title>Random decoys
